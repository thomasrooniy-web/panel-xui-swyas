<style>
:root{
  color-scheme:dark;--w:255,255,255;--gbg:rgba(var(--w),.035);--tbg:rgba(var(--w),.045);--gsh:inset 0 1px 0 rgba(var(--w),.07),0 24px 60px -28px #000;--dlg:linear-gradient(135deg,rgba(40,48,70,.75),rgba(20,24,40,.7));
  --bg:#03050a; --ink:#eef2fb; --ink2:#a4aec4; --ink3:#7c869c;
  --glass:rgba(var(--w),.06); --glass2:rgba(var(--w),.1);
  --edge:rgba(var(--w),.14); --edge2:rgba(var(--w),.08);
  --teal:#3fe0c5; --violet:#8b7bff; --rose:#ff6fa8; --ok:#5df2a4;
  --f:"Clash Display","Abar",system-ui,sans-serif;--fa:"Abar","Clash Display",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f);overflow-x:hidden}
/* backdrop: drifting colour fields so the glass has something to refract */
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.field::after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(var(--w),.12) 1px,transparent 1.6px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 25%,#000 15%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 25%,#000 15%,transparent 80%)}
.field i{position:absolute;border-radius:50%;filter:blur(110px);opacity:.13}
.field i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(circle,#2fd3bd,transparent 65%);animation:d1 28s ease-in-out infinite alternate}
.field i:nth-child(2){width:42vmax;height:42vmax;right:-14vmax;top:12vh;background:radial-gradient(circle,#6f5cff,transparent 65%);animation:d2 34s ease-in-out infinite alternate}
.field i:nth-child(3){width:34vmax;height:34vmax;left:20vw;bottom:-16vmax;background:radial-gradient(circle,#ff5f9b,transparent 65%);opacity:.07;animation:d1 40s ease-in-out infinite alternate-reverse}
@keyframes d1{to{transform:translate(9vmax,7vmax) scale(1.15)}}
@keyframes d2{to{transform:translate(-8vmax,10vmax) scale(.9)}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:32px 20px 64px;display:grid;gap:20px}

/* liquid glass surface */
.glass{position:relative;background:var(--gbg);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border:1px solid rgba(var(--w),.04);border-radius:26px;
  box-shadow:var(--gsh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;background:linear-gradient(145deg,rgba(var(--w),.3),rgba(var(--w),.04) 38%,transparent 62%,rgba(var(--w),.14));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;
  }
.glass>*{position:relative}
.tile{border-radius:20px;padding:18px 20px;background:var(--tbg);border:1px solid var(--edge2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tile small{display:block;color:var(--ink3);font-size:13px;margin-bottom:6px}
.tile b{font-weight:600;font-size:17px;letter-spacing:.01em}

header.glass{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:24px}
.av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:700;font-size:19px;color:#04141a;
  background:linear-gradient(135deg,#3fe0c5,#3a7bff);color:#04141a}
.who{flex:1;min-width:0}
.who h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.02em}
.who p{margin:0;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--edge2);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(var(--w),.25);transition:background .2s,transform .2s}
.ib:hover{background:var(--glass2)} .ib:active{transform:scale(.93)}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.note{display:flex;align-items:center;gap:14px;padding:16px 22px;border-radius:22px;font-size:15px;background:rgba(63,224,197,.05);border-color:rgba(63,224,197,.16);direction:rtl;text-align:right;font-family:var(--fa)}
.note .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 5px rgba(63,224,197,.18);flex:none}

.hero{display:grid;grid-template-columns:240px 1fr;gap:44px;padding:36px;align-items:center}
.ring{position:relative;width:224px;height:224px;margin:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .tr{stroke:rgba(var(--w),.09)}
.ring .pg{stroke:url(#rg);filter:drop-shadow(0 0 8px var(--glow,rgba(63,224,197,.5)));stroke-dasharray:578;stroke-dashoffset:578;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.ring .gl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .gl b{font-size:42px;font-weight:600;line-height:1}
.ring .gl span{font-size:13px;color:var(--ink3);margin-top:4px}
.rem small{color:var(--ink3);font-size:13px}
.rem .big{font-size:clamp(56px,10vw,96px);font-weight:600;line-height:1;letter-spacing:-.035em;margin:6px 0 4px}
.rem .big u{text-decoration:none;font-size:.32em;font-weight:400;color:var(--ink2);margin-inline-start:6px;letter-spacing:0}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.badge{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ok);background:rgba(93,242,164,.12);border:1px solid rgba(93,242,164,.3)}
.badge.off{color:#ff8a8a;background:rgba(255,100,100,.12);border-color:rgba(255,100,100,.3)}

.badge::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-inline-end:7px;animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.bar{display:block;height:4px;border-radius:9px;background:rgba(var(--w),.1);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--teal),#7fb4ff);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row{transition:border-color .2s,background .2s}.row:hover{border-color:var(--edge);background:rgba(var(--w),.07)}
.traffic{display:grid;grid-template-columns:repeat(3,1fr);margin-top:28px;padding-top:24px;border-top:1px solid var(--edge2)}
.traffic>div{padding:0 24px;border-inline-start:1px solid var(--edge2)}
.traffic>div:first-child{padding-inline-start:0;border:0}
.traffic small{display:block;color:var(--ink3);font-size:13px;margin-bottom:4px}
.traffic b{font-size:20px;font-weight:600}
.qcard{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center;padding:32px}
.qcard .qtx{display:grid;gap:18px}
.qcard .quick{justify-content:flex-start}
.qcard .qr svg{width:200px;height:200px}
.tools{display:flex;justify-content:space-between;align-items:center;padding:0 4px;color:var(--ink3);font-size:13.5px}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.wrap>*{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--n,0)*80ms)}
.wrap>:nth-child(n+2){--n:1}.wrap>:nth-child(n+3){--n:2}.wrap>:nth-child(n+4){--n:3}.wrap>:nth-child(n+5){--n:4}.wrap>:nth-child(n+6){--n:5}
.ti{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-inline-end:8px;vertical-align:-2px;opacity:.85}
.ring .tk{stroke:rgba(var(--w),.2);stroke-width:6;stroke-dasharray:1.3 6.66;stroke-linecap:butt}
#remN{background:linear-gradient(180deg,var(--ink) 30%,rgba(var(--w),.55));-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{transition:border-color .2s}.tile:hover{border-color:var(--edge)}
.tabs{display:flex;gap:4px;padding:5px;border-radius:20px;width:100%;overflow-x:auto}
.tabs button{flex:1;justify-content:center;font:500 15px var(--f);color:var(--ink2);background:none;border:0;padding:12px 18px;border-radius:15px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;transition:color .2s,background .25s}
.tabs button[aria-selected=true]{color:var(--ink);background:rgba(var(--w),.09);box-shadow:inset 0 0 0 1px rgba(var(--w),.1),inset 0 -2px 0 var(--teal)}
.tabs em{font-style:normal;font-size:12px;padding:0 7px;border-radius:99px;background:rgba(63,224,197,.18);color:var(--teal)}
.panel{display:none;gap:14px} .panel.on{display:grid;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}

.row{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:22px}
.row .tag{flex:none;font-size:12px;font-weight:600;letter-spacing:.04em;padding:5px 10px;border-radius:10px;color:var(--teal);background:rgba(63,224,197,.12);border:1px solid rgba(63,224,197,.28)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:16px}
.row .tx span{display:block;font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
.row .act{display:flex;gap:8px;flex:none}
.row .ib{width:42px;height:42px}
.btn{font:500 13.5px var(--f);color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--edge2);background:var(--glass);box-shadow:inset 0 1px 0 rgba(var(--w),.22);cursor:pointer;transition:background .2s;white-space:nowrap}
.btn:hover{background:var(--glass2)}
.btn.pri{color:#04141a;background:linear-gradient(135deg,var(--teal),#7fe9ff);border-color:transparent;font-weight:600}
.p-vl{--c:var(--violet)} .p-tr{--c:var(--rose)} .p-vm{--c:#ffc46b}
.row .tag.x{color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 35%,transparent)}

.plat{margin:6px 4px 0;color:var(--ink2);font-size:13.5px;font-weight:500}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.app{padding:20px;border-radius:22px;display:grid;gap:16px}
.app .h{display:flex;gap:12px;align-items:center}
.app .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:700;color:#04141a;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:inset 0 1px 1px rgba(var(--w),.6)}
.app .h b{display:block;font-weight:600}
.app .h span{font-size:12.5px;color:var(--ink3)}
.app .bt{display:flex;gap:8px}
.app .bt .btn{flex:1;text-align:center}

dialog{border:0;background:transparent;padding:16px;color:var(--ink);max-width:340px;width:100%}
dialog::backdrop{background:rgba(3,6,12,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
dialog .glass{padding:22px;text-align:center;display:grid;gap:14px;background:var(--dlg)}
.qr{background:#fff;border-radius:18px;padding:12px;width:fit-content;margin:auto;line-height:0}
.qr svg{width:220px;height:220px}
dialog h3{margin:0;font-weight:600;font-size:16px}
dialog p{margin:0;color:var(--ink3);font-size:12.5px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:9;padding:10px 20px;border-radius:99px;font-size:14px;pointer-events:none;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--ink3);font-size:12.5px}

@media(max-width:700px){
  .hero{grid-template-columns:1fr;padding:24px;gap:28px}.traffic>div{padding:0 12px}.traffic b{font-size:16px}.qcard{grid-template-columns:1fr;justify-items:center;text-align:center;padding:24px}.qcard .quick{justify-content:center}.tabs button{padding:11px 10px;font-size:14px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .row{flex-wrap:wrap} .row .act{width:100%} .row .act .btn{flex:1;text-align:center}
  .who h1{font-size:18px}.wrap{padding:20px 14px 48px;gap:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#lang{font:600 13px var(--f)}
html[lang=fa] *{letter-spacing:0!important}
:root[data-theme=light]{color-scheme:light;--w:15,23,42;--bg:#eceff7;--ink:#0b1220;--ink2:#3d475c;--ink3:#626c84;--teal:#0d9c88;--violet:#5b4bd6;--rose:#d6336c;--ok:#0f8a52;--gbg:rgba(255,255,255,.62);--tbg:rgba(255,255,255,.55);--gsh:inset 0 1px 0 rgba(255,255,255,.9),0 18px 40px -22px rgba(30,41,80,.35);--dlg:rgba(255,255,255,.93)}
[data-theme=light] .field i{opacity:.3!important}
[data-theme=light] .ib,[data-theme=light] .btn{box-shadow:none}
[data-theme=light] .btn.pri{color:#fff;background:linear-gradient(135deg,#0d9c88,#2a7fd6)}
[data-theme=light] .tabs button[aria-selected=true]{background:rgba(255,255,255,.85);color:var(--ink)}
[data-theme=light] .badge.off{color:#c0392b}
[data-theme=light] dialog::backdrop{background:rgba(220,226,240,.6)}

    </div>
  </section>

  <p class="foot" id="foot"></p>
</main>

  $("#cfgN").textContent=nf(DATA.configs.length);
  $("#p-cfg").innerHTML='<div class="tools"><span>'+nf(DATA.configs.length)+' '+t.cfgW+'</span><button class="btn" id="copyAll">'+t.copyAll+'</button></div>'+DATA.configs.map((c,i)=>`<div class="glass row p-${c.k}"><span class="tag x">${c.p}</span><div class="tx"><b>${esc(c.n)}</b><span>${esc(c.u)}</span></div><div class="act"><button class="ib" data-copy="${i}" aria-label="Copy">${ic}</button><button class="ib" data-qr="${i}" aria-label="QR">${qi}</button></div></div>`).join("");
  $("#copyAll").onclick=()=>copy(DATA.configs.map(c=>c.u).join("\n"));
  let h="",g="";
  DATA.apps.forEach(a=>{ if(a.g!==g){ if(g)h+="</div>"; g=a.g; h+=`<div class="plat">${fa&&PD[a.g]||a.g}</div><div class="apps">` }
    h+=`<div class="glass app"><div class="h"><div class="ic" style="--a:${a.a};--b:${a.b}">${a.n[0]}</div><div><b>${a.n}</b><span>${fa&&AD[a.d]||a.d}</span></div></div><div class="bt">${a.im?`<a class="btn pri" href="${a.im}${encodeURIComponent(DATA.sub)}">${t.addLink}</a>`:""}<a class="btn" href="${a.l}" target="_blank" rel="noopener">${t.getApp}</a></div></div>`});
  $("#p-apps").innerHTML=h+"</div>";
  $("#quick").innerHTML=DATA.apps.filter(a=>a.im).slice(0,4).map(a=>`<a class="btn pri" href="${a.im}${encodeURIComponent(DATA.sub)}">${t.addTo}${a.n}</a>`).join("");
  $("#foot").textContent=t.ro+nf(stampT);
}

function qrSvg(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return '<div style="padding:60px 20px;color:#333;font-size:13px;line-height:1.4">QR unavailable</div>'}}
const val=k=>k==="sub"?DATA.sub:DATA.configs[+k].u;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}toast(T[L].copied)}
let cur="";
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]"),q=e.target.closest("[data-qr]"),t=e.target.closest("[data-t]");
  if(c)copy(val(c.dataset.copy));
  if(q){cur=val(q.dataset.qr);$("#dT").textContent=q.dataset.qr==="sub"?T[L].t_sub:DATA.configs[+q.dataset.qr].n;$("#dQ").innerHTML=qrSvg(cur);$("#dU").textContent=cur.length>90?cur.slice(0,90)+"…":cur;dlg.showModal()}
  if(t){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+t.dataset.t))}
});
$("#dC").onclick=()=>copy(cur);
$("#copyTop").onclick=()=>copy(DATA.sub);
$("#refresh").onclick=()=>{stamp();toast(T[L].ok)};
$("#lang").onclick=()=>{L=L==="fa"?"en":"fa";try{localStorage.setItem("lang",L)}catch(e){}render()};
$("#thm").onclick=()=>{TH=TH==="dark"?"light":"dark";try{localStorage.setItem("theme",TH)}catch(e){}render()};
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
stamp(); render();
</script>
</body>
</html>
